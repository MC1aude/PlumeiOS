name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Test on iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test "$SIMULATOR_ID" != "null"
          xcodebuild test -project iosApp/Plume.xcodeproj -scheme Plume \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/Plume-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive for iPhone
        run: |
          set -euo pipefail
          xcodebuild archive -project iosApp/Plume.xcodeproj -scheme Plume \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Plume.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package IPA for Sideloadly
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Plume.xcarchive/Products/Applications/Plume.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Plume.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/Plume-unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/Plume-unsigned.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Plume-unsigned-ipa
          path: ${{ runner.temp }}/Plume-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Verify live SoundCloud audio
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          TEST_RUNNER_PLUME_LIVE_TESTS=1 xcodebuild test -project iosApp/Plume.xcodeproj -scheme Plume \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PlumeTests/CloudLiveTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 45 \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath "$RUNNER_TEMP/Plume-live.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plume-iPhone-tests
          path: |
            ${{ runner.temp }}/Plume-tests.xcresult
            ${{ runner.temp }}/Plume-live.xcresult
          retention-days: 14
