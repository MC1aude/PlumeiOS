name: Plume
options:
  bundleIdPrefix: com.example.plume
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Plume:
    type: application
    platform: iOS
    sources:
      - path: Plume
        excludes:
          - Info.plist
          - ComposeView.swift
    settings:
      base:
        PRODUCT_NAME: Plume
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plume
        INFOPLIST_FILE: Plume/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  PlumeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlumeTests
    dependencies:
      - target: Plume
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PlumeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlumeUITests
    dependencies:
      - target: Plume
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Plume:
    build:
      targets:
        Plume: all
    test:
      targets:
        - PlumeTests
        - PlumeUITests
    run:
      config: Debug
    archive:
      config: Release
